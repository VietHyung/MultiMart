server.port=8080

spring.application.name=multimart-platform

spring.datasource.url=jdbc:postgresql://localhost:5432/multimart_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=123

# Phase 7: schema do Flyway quản lý (db/migration). Hibernate không tự sửa schema nữa.
# Sau khi chạy ổn định có thể đổi sang "validate" để Hibernate kiểm tra Entity khớp schema.
spring.jpa.hibernate.ddl-auto=none

# Flyway: DB cũ (đã có bảng do ddl-auto=update trước đây) được baseline ở V1, DB trống chạy đủ V1..Vn
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:false}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Thời gian quá hạn thanh toán Flash Sale (15 phút = 900000ms)
flashsale.order.timeout-ms=900000

# Thời gian quá hạn thanh toán đơn hàng thường ONLINE (30 phút = 1800000ms)
order.payment-timeout-ms=1800000
# Job quét dự phòng đơn ONLINE quá hạn khi RabbitMQ không khả dụng
order.expiration-scheduler.enabled=true
